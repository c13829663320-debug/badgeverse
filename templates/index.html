<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>吧唧星球 BadgeVerse</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0f0f1a;--card:#1a1a2e;--accent:#7c3aed;--accent2:#ec4899;
    --text:#f0f0f0;--muted:#8888aa;--radius:20px;
  }
  body{background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#16213e 100%);
    color:var(--text);font-family:-apple-system,"Microsoft YaHei",sans-serif;
    min-height:100vh;overflow-x:hidden}
  .container{max-width:480px;margin:0 auto;padding:16px}
  .header{text-align:center;padding:24px 0 16px}
  .header h1{font-size:28px;font-weight:800;
    background:linear-gradient(90deg,#7c3aed,#ec4899);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .header p{color:var(--muted);font-size:13px;margin-top:4px}
  .card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;
    box-shadow:0 4px 20px rgba(0,0,0,0.3)}
  .card h2{font-size:16px;margin-bottom:12px;color:var(--accent2)}
  .upload-area{border:2px dashed #444466;border-radius:var(--radius);padding:32px;
    text-align:center;cursor:pointer;transition:border-color .3s}
  .upload-area:hover{border-color:var(--accent)}
  .upload-area input[type=file]{display:none}
  .upload-icon{font-size:40px;color:var(--accent);margin-bottom:8px}
  .upload-text{color:var(--muted);font-size:14px}
  .style-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .style-btn{background:#222244;border:2px solid transparent;border-radius:14px;
    padding:14px;text-align:center;cursor:pointer;transition:all .3s;font-size:15px}
  .style-btn.active{border-color:var(--accent2);background:rgba(124,58,237,0.15)}
  .style-btn:active{transform:scale(0.95)}
  .input-group{margin-bottom:12px}
  .input-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .input-group input,.input-group select{
    width:100%;background:#222244;border:1px solid #333355;
    border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px}
  .select-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .btn-primary{width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    border:none;border-radius:14px;padding:16px;color:#fff;font-size:17px;font-weight:700;
    cursor:pointer;transition:transform .2s}
  .btn-primary:active{transform:scale(0.97)}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed}
  .result-preview{width:200px;height:200px;border-radius:50%;margin:16px auto;
    border:3px solid var(--accent);overflow:hidden;display:none}
  .result-preview img{width:100%;height:100%;object-fit:cover}
  .pickup-display{text-align:center;padding:20px;display:none}
  .pickup-code{font-size:24px;font-weight:800;color:var(--accent2);letter-spacing:2px}
  .pickup-label{color:var(--muted);font-size:13px;margin-top:4px}
  #canvas-preview{width:200px;height:200px;border-radius:50%;margin:12px auto;
    border:2px solid #333355;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .loading{display:none;text-align:center;padding:20px}
  .spinner{width:40px;height:40px;border:3px solid #333355;border-top-color:var(--accent2);
    border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .step-num{display:inline-block;width:24px;height:24px;border-radius:50%;
    background:var(--accent);color:#fff;text-align:center;line-height:24px;
    font-size:13px;margin-right:6px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>吧唧星球</h1>
    <p>AI 现场自贩终端 · 拍照即做你的专属吧唧</p>
  </div>

  <div class="card">
    <h2><span class="step-num">1</span>上传照片</h2>
    <label class="upload-area" id="upload-area">
      <div class="upload-icon">📷</div>
      <div class="upload-text">点击拍照或选择图片</div>
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" capture="user">
    </label>
  </div>

  <div class="card">
    <h2><span class="step-num">2</span>选风格</h2>
    <div class="style-grid">
      {% for name in styles.keys() %}
      <div class="style-btn" data-style="{{ name }}">{{ name }}</div>
      {% endfor %}
    </div>
  </div>

  <div class="card">
    <h2><span class="step-num">3</span>加文字（可选）</h2>
    <div class="input-group">
      <label>输入文字（中英文混排）</label>
      <input type="text" id="text-input" name="badge-text" placeholder="如：BadgeVerse 2026" maxlength="20">
    </div>
    <div class="select-row">
      <div class="input-group">
        <label>字体</label>
        <select id="font-select">
          {% for f in fonts %}
          <option value="{{ loop.index0 }}">{{ f.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="input-group">
        <label>颜色</label>
        <select id="color-select">
          {% for c in colors %}
          <option value="{{ c.name }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="input-group">
        <label>位置</label>
        <select id="position-select">
          {% for p in positions %}
          <option value="{{ p.name }}">{{ p.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div id="canvas-preview" class="live-preview">
      <span style="color:var(--muted);font-size:12px">预览区</span>
    </div>
  </div>

  <div class="card">
    <button class="btn-primary" id="btn-generate" disabled>生成我的吧唧</button>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div style="color:var(--muted);font-size:14px">AI 创作中...</div>
    </div>
  </div>

  <div class="card">
    <h2><span class="step-num">4</span>查看结果</h2>
    <div class="result-preview" id="result-preview">
      <img id="result-img" src="" alt="">
    </div>
    <div class="pickup-display" id="pickup-code">
      <div class="pickup-label">取件号</div>
      <div class="pickup-code" id="pickup-code-text"></div>
    </div>
  </div>
</div>

<script>
let fileId=null, selectedStyle=null;
const $=s=>document.querySelector(s);
// 风格选择
document.querySelectorAll('.style-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.style-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedStyle=btn.dataset.style;
    $('#btn-generate').disabled=!fileId||!selectedStyle;
  });
});
// 上传
$('#file-input').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  const fd=new FormData(); fd.append('file',f);
  try{
    const r=await fetch('/api/upload',{method:'POST',body:fd});
    const d=await r.json();
    if(!d.ok){alert(d.error||'上传失败');return}
    fileId=d.file_id;
    $('#btn-generate').disabled=!selectedStyle;
  }catch(err){alert('网络错误')}
});
// 生成
$('#btn-generate').addEventListener('click',async()=>{
  $('#btn-generate').style.display='none';
  $('#loading').style.display='block';
  try{
    const body={file_id:fileId,style:selectedStyle};
    if($('#text-input').value) body.text=$('#text-input').value;
    if($('#font-select').value) body.font_index=$('#font-select').value;
    if($('#color-select').value) body.color_name=$('#color-select').value;
    if($('#position-select').value) body.position_name=$('#position-select').value;
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.ok){alert(d.error||'生成失败');$('#btn-generate').style.display='block';$('#loading').style.display='none';return}
    $('#loading').style.display='none';
    $('#result-preview').style.display='block';
    $('#result-img').src=d.result_url+'?t='+Date.now();
    // 下单
    const or=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({style:selectedStyle,result_file:d.result_url,source_file:fileId,gen_ms:d.gen_ms})});
    const od=await or.json();
    if(od.ok){
      $('#pickup-code').style.display='block';
      $('#pickup-code-text').textContent=od.pickup_code;
    }
  }catch(err){alert('生成失败，请重试');$('#btn-generate').style.display='block';$('#loading').style.display='none'}
});
// 加载字体/颜色/位置选项
async function loadOptions(){
  try{
    const[fr,cr,pr]=await Promise.all([
      fetch('/api/fonts').then(r=>r.json()),
      fetch('/api/colors').then(r=>r.json()),
      fetch('/api/positions').then(r=>r.json())
    ]);
    if(fr.ok) fr.fonts.forEach((f,i)=>{const o=document.createElement('option');o.value=i;o.textContent=f.name;$('#font-select').appendChild(o)});
    if(cr.ok) cr.colors.forEach(c=>{const o=document.createElement('option');o.value=c.name;o.textContent=c.name;$('#color-select').appendChild(o)});
    if(pr.ok) pr.positions.forEach(p=>{const o=document.createElement('option');o.value=p.name;o.textContent=p.name;$('#position-select').appendChild(o)});
  }catch(e){}
}
loadOptions();
</script>
</body>
</html>
