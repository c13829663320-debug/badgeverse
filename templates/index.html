<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>吧唧星球 BadgeVerse</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0f0f1a;--card:#1a1a2e;--accent:#7c3aed;--accent2:#ec4899;
    --text:#f0f0f0;--muted:#8888aa;--radius:20px;
    --success:#22c55e;--border:#333355;
  }
  body{background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#16213e 100%);
    color:var(--text);font-family:-apple-system,"Microsoft YaHei",sans-serif;
    min-height:100vh;overflow-x:hidden}
  .container{max-width:480px;margin:0 auto;padding:16px}
  .header{text-align:center;padding:20px 0 12px}
  .header h1{font-size:26px;font-weight:800;
    background:linear-gradient(90deg,#7c3aed,#ec4899);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .header p{color:var(--muted);font-size:12px;margin-top:2px}

  /* 步骤导航指示器 */
  .step-nav{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
  .step-indicator{width:32px;height:32px;border-radius:50%;
    background:#222244;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#666688;transition:all .3s;position:relative}
  .step-indicator.active{background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#fff;font-weight:700;transform:scale(1.1)}
  .step-indicator.done{background:var(--success);color:#fff}
  .step-indicator+.step-indicator::before{
    content:'';position:absolute;left:-12px;top:50%;width:8px;height:2px;
    background:#333355;transform:translateY(-50%)}

  /* 步骤容器 */
  .step-section{display:none;animation:fadeIn .4s ease}
  .step-section.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;
    box-shadow:0 4px 20px rgba(0,0,0,0.3)}
  .card h2{font-size:16px;margin-bottom:12px;color:var(--accent2)}

  /* Step 1: 风格轮播 */
  .style-carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
    padding:8px 0 12px;-webkit-overflow-scrolling:touch}
  .style-carousel::-webkit-scrollbar{height:4px}
  .style-carousel::-webkit-scrollbar-thumb{background:#333355;border-radius:2px}
  .style-thumb{flex:0 0 80px;width:80px;height:80px;border-radius:50%;
    border:3px solid transparent;cursor:pointer;overflow:hidden;
    scroll-snap-align:center;transition:all .3s;position:relative}
  .style-thumb img,.style-thumb .placeholder{
    width:100%;height:100%;object-fit:cover;border-radius:50%}
  .style-thumb .placeholder{display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--muted);background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .style-thumb.selected{border-color:var(--success);transform:scale(1.08)}
  .style-thumb .label{position:absolute;bottom:0;left:0;right:0;
    background:rgba(0,0,0,0.6);color:#fff;font-size:10px;text-align:center;padding:2px}
  .bg-preview{width:200px;height:200px;border-radius:50%;margin:16px auto;
    border:3px solid var(--accent);overflow:hidden;background:#222244;
    display:flex;align-items:center;justify-content:center}
  .bg-preview img{width:100%;height:100%;object-fit:cover}
  .bg-preview .placeholder{color:var(--muted);font-size:13px}

  /* Step 2: 上传 */
  .upload-area{border:2px dashed #444466;border-radius:var(--radius);padding:32px;
    text-align:center;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
  .upload-area:hover{border-color:var(--accent)}
  .upload-area input[type=file]{display:none}
  .upload-icon{font-size:36px;color:var(--accent);margin-bottom:8px}
  .upload-text{color:var(--muted);font-size:14px}
  .person-preview{width:200px;height:200px;border-radius:50%;margin:16px auto;
    border:3px solid var(--accent);overflow:hidden;display:none}
  .person-preview img{width:100%;height:100%;object-fit:cover}

  /* Step 3: 文字 */
  .input-group{margin-bottom:12px}
  .input-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .input-group input,.input-group select{
    width:100%;background:#222244;border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px}
  .select-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

  /* Step 4: 生成 */
  .btn-primary{width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    border:none;border-radius:14px;padding:16px;color:#fff;font-size:17px;font-weight:700;
    cursor:pointer;transition:transform .2s}
  .btn-primary:active{transform:scale(0.97)}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed}
  .btn-secondary{width:100%;background:#222244;border:1px solid #444466;
    border-radius:14px;padding:14px;color:var(--text);font-size:15px;
    cursor:pointer;transition:all .3s}
  .btn-secondary:active{transform:scale(0.97)}
  .btn-nav{display:flex;gap:10px;margin-top:12px}
  .btn-nav .btn-secondary{flex:1}

  .result-preview{width:200px;height:200px;border-radius:50%;margin:16px auto;
    border:3px solid var(--accent);overflow:hidden;display:none}
  .result-preview img{width:100%;height:100%;object-fit:cover}
  .pickup-display{text-align:center;padding:20px;display:none}
  .pickup-code{font-size:24px;font-weight:800;color:var(--accent2);letter-spacing:2px}
  .pickup-label{color:var(--muted);font-size:13px;margin-top:4px}
  #canvas-preview{display:block;width:200px;height:200px;margin:12px auto;
    border-radius:50%;border:2px solid var(--border);background:#222244}
  .loading{display:none;text-align:center;padding:20px}
  .spinner{width:40px;height:40px;border:3px solid #333355;border-top-color:var(--accent2);
    border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 8px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>吧唧星球</h1>
    <p>AI 现场自贩终端 · 三步做你的专属吧唧</p>
  </div>

  <!-- 步骤导航 -->
  <div class="step-nav">
    <div class="step-indicator active" data-step-nav="1">1</div>
    <div class="step-indicator" data-step-nav="2">2</div>
    <div class="step-indicator" data-step-nav="3">3</div>
    <div class="step-indicator" data-step-nav="4">4</div>
  </div>

  <!-- Step 1: 选背景 -->
  <div class="step-section active" id="step-bg" data-step="background">
    <div class="card">
      <h2>选择风格</h2>
      <div class="style-carousel" id="style-carousel">
        {% for name in styles.keys() %}
        <div class="style-thumb" data-style="{{ name }}">
          <div class="placeholder">{{ name }}</div>
          <div class="label">{{ name }}</div>
        </div>
        {% endfor %}
      </div>
      <div class="bg-preview" id="bg-preview">
        <span class="placeholder">点击上方选择风格</span>
      </div>
      <div class="btn-nav">
        <button class="btn-primary" id="btn-bg-next" disabled>下一步：上传照片</button>
      </div>
    </div>
  </div>

  <!-- Step 2: 确定人物 -->
  <div class="step-section" id="step-person" data-step="person">
    <div class="card">
      <h2>上传你的照片</h2>
      <label class="upload-area" id="upload-area">
        <div id="upload-placeholder">
          <div class="upload-icon">📷</div>
          <div class="upload-text">点击拍照或从相册选择</div>
        </div>
        <input type="file" id="file-input" accept="image/*">
      </label>
      <div class="person-preview" id="person-preview">
        <img id="person-img" src="" alt="">
      </div>
      <div class="btn-nav">
        <button class="btn-secondary" id="btn-person-back">上一步</button>
        <button class="btn-primary" id="btn-person-next" disabled>下一步：加文字</button>
      </div>
    </div>
  </div>

  <!-- Step 3: 加文字 -->
  <div class="step-section" id="step-text" data-step="text">
    <div class="card">
      <h2>添加文字（可选）</h2>
      <div class="input-group">
        <label>输入文字（中英文混排）</label>
        <input type="text" id="text-input" name="badge-text" placeholder="如：BadgeVerse 2026" maxlength="20">
      </div>
      <div class="select-row">
        <div class="input-group">
          <label>字体</label>
          <select id="font-select">
            {% for f in fonts %}
            <option value="{{ loop.index0 }}">{{ f.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="input-group">
          <label>颜色</label>
          <select id="color-select">
            {% for c in colors %}
            <option value="{{ c.name }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="input-group">
          <label>位置</label>
          <select id="position-select">
            {% for p in positions %}
            <option value="{{ p.name }}">{{ p.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <canvas id="canvas-preview" width="200" height="200" class="live-preview"></canvas>
      <div class="btn-nav">
        <button class="btn-secondary" id="btn-text-back">上一步</button>
        <button class="btn-primary" id="btn-text-next">下一步：生成</button>
      </div>
    </div>
  </div>

  <!-- Step 4: 生成 -->
  <div class="step-section" id="step-generate" data-step="generate">
    <div class="card">
      <h2>生成你的吧唧</h2>
      <div style="text-align:center;padding:8px 0 12px;color:var(--muted);font-size:14px" id="gen-summary">
        风格：未选择 · 照片：未上传
      </div>
      <button class="btn-primary" id="btn-generate">生成我的吧唧</button>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div style="color:var(--muted);font-size:14px">AI 创作中...</div>
      </div>
      <div class="result-preview" id="result-preview">
        <img id="result-img" src="" alt="">
      </div>
      <div class="pickup-display" id="pickup-code">
        <div class="pickup-label">取件号</div>
        <div class="pickup-code" id="pickup-code-text"></div>
      </div>
      <button class="btn-secondary" id="btn-redo" style="display:none;margin-top:12px">重新制作</button>
    </div>
  </div>
</div>

<script>
let selectedStyle=null, fileId=null, uploadedImgUrl=null;
const $=s=>document.querySelector(s);
const canvas=$('#canvas-preview');
const ctx=canvas.getContext('2d');

const COLOR_MAP={'白色':'#fff','黑色':'#000','红色':'#ff4646','蓝色':'#3c82f6',
  '绿色':'#22c55e','黄色':'#ffd700','粉色':'#ff69b4','紫色':'#9370db'};
const FONT_MAP=['"Microsoft YaHei"','"SimHei"','"SimSun"','"KaiTi"','"DengXian"'];

// 步骤切换
function gotoStep(n){
  document.querySelectorAll('.step-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.step-indicator').forEach((s,i)=>{
    s.classList.remove('active','done');
    if(i+1<n) s.classList.add('done');
    else if(i+1===n) s.classList.add('active');
  });
  $('#step-'+['bg','person','text','generate'][n-1]).classList.add('active');
  updateSummary();
}

function updateSummary(){
  const s=$('#gen-summary');
  if(s) s.textContent='风格：'+(selectedStyle||'未选择')+' · 照片：'+(fileId?'已上传':'未上传');
}

// Step 1: 风格选择
document.querySelectorAll('.style-thumb').forEach(thumb=>{
  thumb.addEventListener('click',()=>{
    document.querySelectorAll('.style-thumb').forEach(t=>t.classList.remove('selected'));
    thumb.classList.add('selected');
    selectedStyle=thumb.dataset.style;
    // 更新大图预览
    const ph=thumb.querySelector('.placeholder');
    $('#bg-preview').innerHTML='<div class="placeholder" style="background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700">'+selectedStyle+'</div>';
    $('#btn-bg-next').disabled=false;
  });
});
$('#btn-bg-next').addEventListener('click',()=>gotoStep(2));

// Step 2: 上传
$('#file-input').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  const localUrl=URL.createObjectURL(f);
  uploadedImgUrl=localUrl;
  $('#upload-placeholder').style.display='none';
  $('#person-preview').style.display='block';
  $('#person-img').src=localUrl;
  const fd=new FormData(); fd.append('file',f);
  try{
    const r=await fetch('/api/upload',{method:'POST',body:fd});
    const d=await r.json();
    if(!d.ok){alert(d.error||'上传失败');return}
    fileId=d.file_id;
    uploadedImgUrl=d.preview_url;
    $('#person-img').src=d.preview_url;
    $('#btn-person-next').disabled=false;
  }catch(err){alert('网络错误，请重试')}
});
$('#btn-person-back').addEventListener('click',()=>gotoStep(1));
$('#btn-person-next').addEventListener('click',()=>{drawPreview();gotoStep(3)});

// Step 3: 文字实时预览
function drawPreview(){
  ctx.clearRect(0,0,200,200);
  ctx.save();
  ctx.beginPath();ctx.arc(100,100,98,0,Math.PI*2);ctx.closePath();ctx.clip();
  if(uploadedImgUrl){
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=()=>{const s=Math.min(img.width,img.height);
      const sx=(img.width-s)/2,sy=(img.height-s)/2;
      ctx.drawImage(img,sx,sy,s,s,0,0,200,200);drawText();};
    img.src=uploadedImgUrl;
  }else{ctx.fillStyle='#222244';ctx.fillRect(0,0,200,200);
    ctx.fillStyle='#8888aa';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText('预览区',100,105);}
  ctx.restore();
}
function drawText(){
  const text=$('#text-input').value.trim();if(!text)return;
  const color=COLOR_MAP[$('#color-select').value]||'#fff';
  const fontIdx=parseInt($('#font-select').value)||0;
  const fontFamily=FONT_MAP[fontIdx]||'sans-serif';
  let fontSize=22;ctx.font='bold '+fontSize+'px '+fontFamily;
  let tw=ctx.measureText(text).width;
  while(tw>160&&fontSize>10){fontSize-=2;ctx.font='bold '+fontSize+'px '+fontFamily;tw=ctx.measureText(text).width}
  ctx.textAlign='center';ctx.fillStyle=color;ctx.strokeStyle='#000';ctx.lineWidth=2;
  const pos=$('#position-select').value;
  let y=pos==='顶部'?40:pos==='居中'?108:172;
  ctx.strokeText(text,100,y);ctx.fillText(text,100,y);
}
['#text-input','#font-select','#color-select','#position-select'].forEach(sel=>{
  $(sel).addEventListener('input',drawPreview);$(sel).addEventListener('change',drawPreview);
});
$('#btn-text-back').addEventListener('click',()=>gotoStep(2));
$('#btn-text-next').addEventListener('click',()=>gotoStep(4));

// Step 4: 生成
$('#btn-generate').addEventListener('click',async()=>{
  if(!fileId){alert('请先上传照片');gotoStep(2);return}
  if(!selectedStyle){alert('请先选择风格');gotoStep(1);return}
  $('#btn-generate').style.display='none';
  $('#loading').style.display='block';
  try{
    const body={file_id:fileId,style:selectedStyle};
    if($('#text-input').value) body.text=$('#text-input').value;
    body.font_index=parseInt($('#font-select').value)||0;
    body.color_name=$('#color-select').value;
    body.position_name=$('#position-select').value;
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.ok){alert(d.error||'生成失败');$('#btn-generate').style.display='block';$('#loading').style.display='none';return}
    const taskId=d.task_id;let result=null;
    for(let i=0;i<60;i++){
      await new Promise(r=>setTimeout(r,2000));
      const tr=await fetch('/api/task/'+taskId);const td=await tr.json();
      if(td.status==='done'){result=td;break}
      if(td.status==='error'){alert('生成失败：'+(td.error||''));$('#btn-generate').style.display='block';$('#loading').style.display='none';return}
    }
    if(!result){alert('生成超时，请重试');$('#btn-generate').style.display='block';$('#loading').style.display='none';return}
    $('#loading').style.display='none';
    $('#result-preview').style.display='block';
    $('#result-img').src=result.result_url+'?t='+Date.now();
    const or=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({style:selectedStyle,result_file:result.result_url,source_file:fileId,gen_ms:result.gen_ms})});
    const od=await or.json();
    if(od.ok){$('#pickup-code').style.display='block';$('#pickup-code-text').textContent=od.pickup_code;$('#btn-redo').style.display='block'}
  }catch(err){alert('生成失败，请重试');$('#btn-generate').style.display='block';$('#loading').style.display='none'}
});
$('#btn-redo').addEventListener('click',()=>location.reload());
drawPreview();
</script>
</body>
</html>
